---
# Block-Mode PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corrupted-fs-pvc
  labels:
    app: corrupted-fs
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: powerstore-ext4-retain
  resources:
    requests:
      storage: 10Mi
---
# Job to Load the Image
apiVersion: batch/v1
kind: Job
metadata:
  name: load-corrupted-image-job
spec:
  template:
    spec:
      restartPolicy: Never
      volumes:
      - name: corrupted-block-volume
        persistentVolumeClaim:
          claimName: corrupted-fs-pvc
      containers:
      - name: load-container
        image: quay.io/coulof/corrupted-fs-loader:latest  # Your custom image
        securityContext:
          privileged: true  # Required for block device access
        volumeDevices:
        - name: corrupted-block-volume
          devicePath: /dev/block-device  # Where the block device is mounted; the entrypoint script writes here
      restartPolicy: Never
  backoffLimit: 1
